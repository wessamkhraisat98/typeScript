<section class="section">
  <h2>🛒 Shopping Cart</h2>
  <div class="cart-card">
    <p><strong>Product:</strong> {{ productName }}</p>
    <p><strong>Unit Price:</strong> ${{ productPrice }}</p>
    <p><strong>Quantity:</strong> {{ quantity }}</p>
    <p class="total"><strong>Total Price:</strong> ${{ productPrice * quantity }}</p>
  </div>
</section>
